#cloud-config
bootcmd:
- printf "[Resolve]\nDNS=8.8.8.8" > /etc/systemd/resolved.conf
- [systemctl, restart, systemd-resolved]
users:
  - name: root
    ssh_authorized_keys:
    - ${ssh_public_key}
growpart:
    mode: auto
    devices: ["/"]
manage_etc_hosts: localhost
locale: "en_US.UTF-8"
package_update: true
package_upgrade: true
packages:
    - haproxy
    - chrony
write_files:
  - path: /etc/netplan/99-static.yaml
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true
            dhcp4-overrides:
              use-routes: false
              use-dns: false
          k8snet:
            match:
              macaddress: "${mac_address}"
            set-name: k8snet
            addresses:
              - ${static_ip}/24
            nameservers:
              addresses: [8.8.8.8, 8.8.4.4]
            dhcp4: false
  - path: /etc/sysctl.d/forward.conf
    content: |
      net.ipv4.ip_forward=1
  - path: /etc/chrony/chrony.conf
    content: |
      # Lab cluster NTP config. Uses chrony (not ntpd) because chrony's
      # `makestep 1.0 -1` directive instantly steps the clock for any
      # drift at any time -- ntpd panics and refuses to step once drift
      # exceeds 1000s, which is exactly what happens when a Multipass
      # VM is suspended/resumed.
      pool pool.ntp.org iburst maxsources 4
      makestep 1.0 -1
      rtcsync
      driftfile /var/lib/chrony/chrony.drift
      logdir /var/log/chrony
  - path: /etc/systemd/system/chrony.service.d/restart.conf
    content: |
      [Service]
      Restart=on-failure
      RestartSec=5
runcmd:
- netplan apply
- sysctl --system
- systemctl stop systemd-timesyncd || true
- systemctl disable systemd-timesyncd || true
- systemctl daemon-reload
- systemctl enable --now chrony
- systemctl restart haproxy
- touch /tmp/signal
